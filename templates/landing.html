<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Street - Loja</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="robots" content="noindex">
</head>
<body class="loja-page">
    <header class="loja-header">
        <div class="loja-header-inner">
            <div>
                <h1>MG Street</h1>
                <p class="subtitle">Streetwear — vista a sua rua</p>
            </div>
            <div class="loja-actions">
                <a class="btn" href="/login">Entrar</a>
            </div>
        </div>
    </header>

    <main class="loja-main">
        <section class="loja-hero card">
            <div>
                <span class="section-kicker">Bem-vindo</span>
                <h2>Nossa coleção, do seu jeito</h2>
                <p class="muted">Dê uma olhada nos produtos. Entre para montar seu carrinho e comprar.</p>
            </div>
            <div class="filter-summary">
                <strong id="product-count">0</strong>
                <span>itens disponíveis</span>
            </div>
        </section>

        <section id="catalog" class="products-grid" aria-live="polite"></section>
    </main>

    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <script>
        const catalog = document.getElementById('catalog');
        const productCount = document.getElementById('product-count');

        function createCard(product) {
            const card = document.createElement('article');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-img">
                    <img src="${product.image_url || ''}" alt="${product.name}"/>
                </div>
                <div class="product-body">
                    ${product.category ? `<span class="product-tag">${product.category}</span>` : ''}
                    <h4>${product.name}</h4>
                    <p class="muted">${product.description || ''}</p>
                    <div class="product-footer">
                        <strong>R$ ${product.price != null ? Number(product.price).toFixed(2) : '0.00'}</strong>
                        <a class="btn" href="/login">Entrar para comprar</a>
                    </div>
                </div>
            `;
            return card;
        }

        async function loadPublicProducts() {
            try {
                const resp = await fetch('/api/public/products');
                if (!resp.ok) {
                    showToast('Não foi possível carregar os produtos.');
                    return;
                }
                const data = await resp.json();
                const products = data.products || [];
                productCount.textContent = products.length;
                catalog.innerHTML = '';
                products.forEach((product) => catalog.appendChild(createCard(product)));
            } catch (err) {
                console.error('Erro ao carregar produtos', err);
                showToast('Erro ao carregar os produtos.');
            }
        }

        loadPublicProducts();
    </script>
</body>
</html>
