<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Street - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="robots" content="noindex">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <img src="{{ url_for('static', filename='logo/logo.jpg') }}" alt="MG Street Logo">
                <h1>MG Street</h1>
            </div>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha" required>

                <button type="submit">Entrar</button>
            </form>
            <p class="auth-alt">Não tem conta? <a href="/register">Criar conta</a></p>
            <div class="carousel">
                <div class="carousel-track">
                    <div class="carousel-slide">Promoção 1 - Frete grátis</div>
                    <div class="carousel-slide">Promoção 2 - 10% OFF</div>
                    <div class="carousel-slide">Promoção 3 - Novidades na loja</div>
                </div>
                <div class="carousel-dots" aria-hidden="true"></div>
            </div>

            <div class="social-section">
                <p>Ou entre com</p>
                <div class="social-buttons">
                    <button type="button" class="social-btn google">Google</button>
                    <button type="button" class="social-btn facebook">Facebook</button>
                    <button type="button" class="social-btn instagram">Instagram</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
