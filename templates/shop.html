<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Street - Loja</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="robots" content="noindex">
</head>
<body class="loja-page">
    <header class="loja-header">
        <div class="loja-header-inner">
            <div>
                <h1>Loja MG Street</h1>
                <p class="subtitle">Escolha por categoria e monte seu carrinho</p>
            </div>
            <div class="loja-actions">
                <button id="orders-btn" class="btn btn-ghost">Meus pedidos</button>
                <button id="logout-btn" class="btn btn-ghost">Sair</button>
            </div>
        </div>
    </header>

    <main class="loja-main">
        <section class="loja-hero card">
            <div>
                <span class="section-kicker">Coleções</span>
                <h2>Produtos prontos para uso diário</h2>
                <p class="muted">Filtre por categoria, navegue pelos grupos e finalize quando quiser.</p>
            </div>
            <div class="filter-summary">
                <strong id="product-count">0</strong>
                <span>itens disponíveis</span>
            </div>
        </section>

        <section class="category-filters card" aria-label="Filtro por categoria">
            <div class="filters-header">
                <h3>Categoria</h3>
                <p class="muted">Selecione uma opção para agrupar os produtos.</p>
            </div>
            <div id="category-filters" class="filter-chips"></div>
        </section>

        <section id="catalog-sections" class="catalog-sections" aria-live="polite">
            <!-- Seções serão inseridas via JS -->
        </section>
    </main>

    <button id="cart-button" class="cart-button">Carrinho (<span id="cart-count">0</span>)</button>

    <aside id="cart-panel" class="cart-panel" aria-hidden="true">
        <header>
            <h3>Seu Carrinho</h3>
            <button id="close-cart" class="btn btn-ghost">Fechar</button>
        </header>
        <div id="cart-items" class="cart-items"></div>
        <footer>
            <div>Total: R$ <span id="cart-total">0.00</span></div>
            <button id="checkout-btn" class="btn">Finalizar Compra</button>
        </footer>
    </aside>

    <aside id="orders-panel" class="cart-panel" aria-hidden="true">
        <header>
            <h3>Meus pedidos</h3>
            <button id="close-orders" class="btn btn-ghost">Fechar</button>
        </header>
        <div id="orders-list" class="cart-items"></div>
    </aside>

    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <script>
        const PREVIEW_TOKEN_KEY = 'mgstreet_preview_token';
        const TOKEN_KEY = 'mgstreet_token';

        (function checkAuthAndSetupButton() {
            const previewToken = localStorage.getItem(PREVIEW_TOKEN_KEY);
            const token = previewToken || localStorage.getItem(TOKEN_KEY);
            const logoutBtn = document.getElementById('logout-btn');

            if (!token) {
                window.location.href = '/login';
                return;
            }

            if (previewToken) {
                logoutBtn.textContent = 'Voltar';
                logoutBtn.onclick = function () {
                    localStorage.removeItem(PREVIEW_TOKEN_KEY);
                    window.location.href = '/admin';
                };
            } else {
                logoutBtn.textContent = 'Sair';
                logoutBtn.onclick = function () {
                    localStorage.removeItem(TOKEN_KEY);
                    window.location.href = '/';
                };
            }
        })();

        const catalogSections = document.getElementById('catalog-sections');
        const categoryFilters = document.getElementById('category-filters');
        const productCount = document.getElementById('product-count');
        let allProducts = [];
        let activeCategory = 'todos';

        // showToast vem de static/toast.js
        function getToken() {
            return localStorage.getItem(PREVIEW_TOKEN_KEY) || localStorage.getItem(TOKEN_KEY);
        }

        function normalizeCategory(category) {
            return (category || 'sem-categoria').toString().trim().toLowerCase();
        }

        function getCategoryLabel(category) {
            const labels = {
                todos: 'Todos',
                camisetas: 'Camisetas',
                calcas: 'Calças',
                meias: 'Meias',
                'sem-categoria': 'Sem categoria',
            };
            return labels[category] || category.charAt(0).toUpperCase() + category.slice(1);
        }

        function buildCategoryFilters(products) {
            const categories = Array.from(new Set(products.map((product) => normalizeCategory(product.category))))
                .filter(Boolean)
                .sort();

            const options = ['todos', ...categories];
            categoryFilters.innerHTML = '';

            options.forEach((category) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `filter-chip ${category === activeCategory ? 'active' : ''}`;
                button.textContent = getCategoryLabel(category);
                button.dataset.category = category;
                button.addEventListener('click', function () {
                    activeCategory = category;
                    buildCategoryFilters(allProducts);
                    renderCatalog();
                });
                categoryFilters.appendChild(button);
            });
        }

        function createProductCard(product) {
            const card = document.createElement('article');
            card.className = 'product-card';
            const options = product.options || {};
            const optionsHtml = Object.keys(options).map(function (key) {
                const opts = (options[key] || []).map(function (v) { return `<option value="${v}">${v}</option>`; }).join('');
                return `<label class="product-option"><span>${key}</span><select data-opt="${key}">${opts}</select></label>`;
            }).join('');
            const soldOut = product.stock != null && product.stock <= 0;
            card.innerHTML = `
                <div class="product-img">
                    <img src="${product.image_url || ''}" alt="${product.name}"/>
                </div>
                <div class="product-body">
                    <span class="product-tag">${getCategoryLabel(normalizeCategory(product.category))}</span>
                    <h4>${product.name}</h4>
                    <p class="muted">${product.description || ''}</p>
                    ${optionsHtml ? `<div class="product-options">${optionsHtml}</div>` : ''}
                    <div class="product-footer">
                        <strong>R$ ${product.price != null ? Number(product.price).toFixed(2) : '0.00'}</strong>
                        ${soldOut
                            ? '<span class="muted">Esgotado</span>'
                            : `<button class="btn buy-btn" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}">Comprar</button>`}
                    </div>
                </div>
            `;
            return card;
        }

        function renderCatalog() {
            const productsToRender = activeCategory === 'todos'
                ? allProducts
                : allProducts.filter((product) => normalizeCategory(product.category) === activeCategory);

            productCount.textContent = productsToRender.length;
            catalogSections.innerHTML = '';

            if (productsToRender.length === 0) {
                const empty = document.createElement('section');
                empty.className = 'catalog-empty card';
                empty.innerHTML = '<h3>Nenhum produto encontrado.</h3><p class="muted">Tente outra categoria.</p>';
                catalogSections.appendChild(empty);
                return;
            }

            const groupedProducts = {};
            productsToRender.forEach((product) => {
                const category = normalizeCategory(product.category);
                if (!groupedProducts[category]) {
                    groupedProducts[category] = [];
                }
                groupedProducts[category].push(product);
            });

            Object.keys(groupedProducts)
                .sort()
                .forEach((category) => {
                    const section = document.createElement('section');
                    section.className = 'catalog-group card';
                    section.innerHTML = `
                        <div class="catalog-group-header">
                            <div>
                                <span class="section-kicker">${getCategoryLabel(category)}</span>
                                <h3>${getCategoryLabel(category)}</h3>
                            </div>
                            <span class="group-count">${groupedProducts[category].length} produto(s)</span>
                        </div>
                    `;

                    const grid = document.createElement('div');
                    grid.className = 'products-grid';

                    groupedProducts[category].forEach((product) => {
                        grid.appendChild(createProductCard(product));
                    });

                    section.appendChild(grid);
                    catalogSections.appendChild(section);
                });
        }

        async function loadProducts() {
            const token = getToken();
            try {
                const resp = await fetch('/api/products', {
                    headers: { Authorization: `Bearer ${token}` },
                });

                if (!resp.ok) {
                    showToast('Não foi possível carregar os produtos.');
                    return;
                }

                const data = await resp.json();
                allProducts = data.products || [];
                productCount.textContent = allProducts.length;
                buildCategoryFilters(allProducts);
                renderCatalog();
            } catch (err) {
                console.error('Erro ao carregar produtos', err);
                showToast('Erro ao carregar produtos.');
            }
        }

        document.addEventListener('click', function (e) {
            const btn = e.target.closest('button.buy-btn');
            if (!btn) return;

            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            const price = parseFloat(btn.getAttribute('data-price')) || 0;

            // Coleta as opções escolhidas (cor/tamanho/...) do card, se houver.
            const selected = {};
            const card = btn.closest('.product-card');
            if (card) {
                card.querySelectorAll('select[data-opt]').forEach(function (sel) {
                    selected[sel.getAttribute('data-opt')] = sel.value;
                });
            }

            const cart = JSON.parse(sessionStorage.getItem('mg_cart') || '[]');
            // Agrupa item idêntico (mesmo id + mesmas opções), somando quantidade.
            const key = id + '|' + JSON.stringify(selected);
            const existing = cart.find(function (it) {
                return (it.id + '|' + JSON.stringify(it.options || {})) === key;
            });
            if (existing) {
                existing.quantity = (existing.quantity || 1) + 1;
            } else {
                cart.push({ id, name: name, price: price, quantity: 1, options: selected });
            }
            persistCart(cart);
            showToast('Item adicionado ao carrinho');
            updateCartUI();
        });

        const cartButton = document.getElementById('cart-button');
        const cartCount = document.getElementById('cart-count');
        const cartPanel = document.getElementById('cart-panel');
        const cartItemsEl = document.getElementById('cart-items');
        const cartTotalEl = document.getElementById('cart-total');
        const closeCart = document.getElementById('close-cart');

        function updateCartUI() {
            const cart = JSON.parse(sessionStorage.getItem('mg_cart') || '[]');
            cartItemsEl.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach((item, index) => {
                const qty = parseInt(item.quantity || 1, 10);
                count += qty;
                const opts = item.options || {};
                const optsText = Object.keys(opts).map(function (k) { return `${k}: ${opts[k]}`; }).join(' · ');
                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        ${optsText ? `<div class="muted">${optsText}</div>` : ''}
                        <div class="cart-qty">
                            <button class="qty-btn" data-act="dec" data-index="${index}" aria-label="Diminuir">−</button>
                            <span>${qty}</span>
                            <button class="qty-btn" data-act="inc" data-index="${index}" aria-label="Aumentar">+</button>
                            <button class="qty-btn remove" data-act="rm" data-index="${index}">remover</button>
                        </div>
                    </div>
                    <div>R$ ${item.price != null ? (Number(item.price) * qty).toFixed(2) : '0.00'}</div>
                `;
                cartItemsEl.appendChild(row);
                total += parseFloat(item.price || 0) * qty;
            });

            cartCount.textContent = count;
            cartTotalEl.textContent = total.toFixed(2);
        }

        // Controles de quantidade/remover no painel do carrinho.
        cartItemsEl.addEventListener('click', function (e) {
            const btn = e.target.closest('.qty-btn');
            if (!btn) return;
            const index = parseInt(btn.getAttribute('data-index'), 10);
            const act = btn.getAttribute('data-act');
            const cart = JSON.parse(sessionStorage.getItem('mg_cart') || '[]');
            if (!cart[index]) return;
            if (act === 'inc') cart[index].quantity = (cart[index].quantity || 1) + 1;
            else if (act === 'dec') cart[index].quantity = Math.max(1, (cart[index].quantity || 1) - 1);
            else if (act === 'rm') cart.splice(index, 1);
            persistCart(cart);
            updateCartUI();
        });

        cartButton.addEventListener('click', function () {
            cartPanel.setAttribute('aria-hidden', 'false');
            updateCartUI();
        });

        closeCart.addEventListener('click', function () {
            cartPanel.setAttribute('aria-hidden', 'true');
        });

        document.getElementById('checkout-btn').addEventListener('click', async function () {
            const cart = JSON.parse(sessionStorage.getItem('mg_cart') || '[]');
            if (!cart || cart.length === 0) {
                alert('Carrinho vazio.');
                return;
            }

            const token = localStorage.getItem(TOKEN_KEY);
            try {
                const resp = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`,
                    },
                    body: JSON.stringify({ items: cart }),
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    alert(err.error || 'Falha no checkout');
                    return;
                }

                const data = await resp.json();
                if (data.init_point) {
                    // Pagamento configurado: vai pro checkout do Mercado Pago.
                    window.location.href = data.init_point;
                    return;
                }
                // Fallback (sem pagamento configurado): pedido registrado.
                alert('Pedido registrado. ID: ' + (data.order_id || 'N/A'));
                persistCart([]);
                updateCartUI();
                cartPanel.setAttribute('aria-hidden', 'true');
            } catch (err) {
                alert('Erro de rede ao enviar pedido.');
            }
        });

        // Meus pedidos
        const ordersPanel = document.getElementById('orders-panel');
        const ordersList = document.getElementById('orders-list');
        document.getElementById('close-orders').addEventListener('click', function () {
            ordersPanel.setAttribute('aria-hidden', 'true');
        });
        document.getElementById('orders-btn').addEventListener('click', async function () {
            ordersPanel.setAttribute('aria-hidden', 'false');
            ordersList.innerHTML = '<p class="muted">Carregando...</p>';
            try {
                const resp = await fetch('/api/orders/me', { headers: { Authorization: `Bearer ${getToken()}` } });
                if (!resp.ok) { ordersList.innerHTML = '<p class="muted">Não foi possível carregar.</p>'; return; }
                const orders = (await resp.json()).orders || [];
                if (!orders.length) { ordersList.innerHTML = '<p class="muted">Você ainda não tem pedidos.</p>'; return; }
                ordersList.innerHTML = '';
                orders.forEach(function (order) {
                    const itemsText = (order.items || []).map(function (it) { return `${it.name} x${it.quantity || 1}`; }).join(', ');
                    const when = order.created_at ? new Date(order.created_at).toLocaleString('pt-BR') : '';
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <div>
                            <strong>Pedido #${order.id}</strong>
                            <div class="muted">${itemsText}</div>
                            <div class="muted">${when}</div>
                        </div>
                        <div>R$ ${Number(order.total).toFixed(2)}</div>
                    `;
                    ordersList.appendChild(div);
                });
            } catch (err) {
                ordersList.innerHTML = '<p class="muted">Erro de rede.</p>';
            }
        });

        // Persistência do carrinho no servidor (aditivo: sessionStorage segue dirigindo a UI).
        function persistCart(cart) {
            sessionStorage.setItem('mg_cart', JSON.stringify(cart));
            fetch('/api/cart', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
                body: JSON.stringify({ items: cart }),
            }).catch(function () { /* best-effort */ });
        }

        async function loadServerCart() {
            try {
                const resp = await fetch('/api/cart', { headers: { Authorization: `Bearer ${getToken()}` } });
                if (resp.ok) {
                    const items = (await resp.json()).items || [];
                    const local = JSON.parse(sessionStorage.getItem('mg_cart') || '[]');
                    if (local.length === 0 && items.length > 0) {
                        sessionStorage.setItem('mg_cart', JSON.stringify(items));
                    }
                }
            } catch (err) { /* best-effort */ }
            updateCartUI();
        }

        // Retorno do Mercado Pago (back_url): confirma o pagamento e limpa o carrinho.
        async function handlePaymentReturn() {
            const params = new URLSearchParams(window.location.search);
            const payment = params.get('payment');
            if (!payment) return;
            const paymentId = params.get('payment_id') || params.get('collection_id');
            if (payment === 'success' && paymentId) {
                try {
                    const resp = await fetch('/api/payments/confirm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
                        body: JSON.stringify({ payment_id: paymentId }),
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (resp.ok && data.status === 'paid') {
                        showToast('Pagamento aprovado! Pedido confirmado.');
                        persistCart([]);
                    } else {
                        showToast('Pagamento ' + (data.status || 'pendente') + '.');
                    }
                } catch (err) {
                    showToast('Não foi possível confirmar o pagamento.');
                }
            } else if (payment === 'failure') {
                showToast('Pagamento não concluído.');
            } else if (payment === 'pending') {
                showToast('Pagamento pendente.');
            }
            window.history.replaceState({}, '', '/shop');
            updateCartUI();
        }

        loadProducts();
        loadServerCart();
        handlePaymentReturn();
    </script>
</body>
</html>
