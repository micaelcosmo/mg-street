<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Street - Criar conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="robots" content="noindex">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <img src="{{ url_for('static', filename='logo/logo.jpg') }}" alt="MG Street Logo">
                <h1>Criar conta</h1>
            </div>
            <form id="register-form">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" placeholder="Seu nome" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha" required>

                <button type="submit">Criar conta</button>
            </form>
            <p class="auth-alt">Já tem conta? <a href="/login">Entrar</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };
            try {
                const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    alert(data.error || 'Falha ao criar conta.');
                    return;
                }
                alert('Conta criada! Faça login.');
                window.location.href = '/login';
            } catch (err) {
                alert('Erro de rede ao criar conta.');
            }
        });
    </script>
</body>
</html>
