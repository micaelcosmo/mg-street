services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgstreet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgstreet_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mgstreet_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgstreet_user} -d ${POSTGRES_DB:-mgstreet_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      POSTGRES_USER: ${POSTGRES_USER:-mgstreet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgstreet_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mgstreet_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PORT: ${PORT:-5001}
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
