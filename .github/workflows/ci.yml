name: CI

  on:
    push:
      branches: [ main ]
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:18-alpine
          env:
            POSTGRES_USER: mgstreet_user
            POSTGRES_PASSWORD: mgstreet_pass
            POSTGRES_DB: mgstreet_db
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U mgstreet_user -d mgstreet_db"
            --health-interval 5s --health-timeout 5s --health-retries 10

      env:
        MGSTREET_DB_TESTS: "1"
        POSTGRES_HOST: localhost
        POSTGRES_PORT: "5432"
        POSTGRES_USER: mgstreet_user
        POSTGRES_PASSWORD: mgstreet_pass
        POSTGRES_DB: mgstreet_db
        JWT_SECRET: ci_test_secret_key_long_enough_0001
        PASSWORD_SALT: ci_salt

      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Instalar dependências
          run: pip install --no-cache-dir -r requirements.txt
        - name: Rodar testes (mockados + E2E contra o Postgres do serviço)
          run: pytest -q
